<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🏆 Past Simple Champions — The Ultimate Sports Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============ BASE ============ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        button {
            font-family: inherit
        }

        body {
            font-family: 'Baloo 2', 'Comic Sans MS', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            color: #1d2733;
            background: linear-gradient(180deg, #aee3ff 0%, #e8f7ff 42%, #dcf3e0 100%);
            background-attachment: fixed;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none
        }

        input {
            user-select: text;
            -webkit-user-select: text
        }

        #bgdecor {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden
        }

        #bgdecor span {
            position: absolute;
            opacity: .09;
            animation: floatY 9s ease-in-out infinite
        }

        #app {
            position: relative;
            z-index: 1
        }

        #toast-layer {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none
        }

        #confetti {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1200
        }

        /* ============ BUTTONS & CHIPS ============ */
        .btn {
            border: none;
            border-radius: 16px;
            padding: 13px 26px;
            font-size: 19px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .15s, box-shadow .15s;
            box-shadow: 0 6px 0 rgba(20, 50, 90, .18)
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(20, 50, 90, .18)
        }

        .btn-primary {
            background: linear-gradient(#ffd75e, #f4a71d);
            color: #5a3800
        }

        .btn-green {
            background: linear-gradient(#59d97b, #2fb344);
            color: #fff;
            text-shadow: 0 2px 0 rgba(0, 0, 0, .15)
        }

        .btn-blue {
            background: linear-gradient(#5db4f2, #1e88e5);
            color: #fff;
            text-shadow: 0 2px 0 rgba(0, 0, 0, .15)
        }

        .btn-grey {
            background: #e7edf4;
            color: #4a5a70
        }

        .btn-huge {
            font-size: 23px;
            padding: 16px 42px;
            border-radius: 20px
        }

        .btn-mini {
            background: #fff;
            border: 2px solid #d7e3f2;
            border-radius: 12px;
            min-width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer
        }

        .btn-mini:hover {
            background: #f0f6ff
        }

        .btn-speak {
            border: 2px solid #c9dbf5;
            background: #eef4ff;
            border-radius: 10px;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 15px;
            vertical-align: middle
        }

        .btn-speak:hover {
            background: #dbe9ff
        }

        .chip {
            background: #fff;
            border: 3px solid #ffe082;
            border-radius: 999px;
            padding: 5px 15px;
            font-weight: 800;
            box-shadow: 0 4px 0 rgba(20, 50, 90, .08);
            font-size: 15px;
            white-space: nowrap
        }

        .score-chip.pulse {
            animation: pulse .5s
        }

        @keyframes pulse {
            40% {
                transform: scale(1.2)
            }
        }

        .toast {
            background: #1d2733;
            color: #fff;
            padding: 11px 22px;
            border-radius: 99px;
            font-weight: 800;
            font-size: 16px;
            opacity: 0;
            transform: translateY(-14px);
            transition: .35s;
            box-shadow: 0 10px 26px rgba(0, 0, 0, .3);
            text-align: center;
            max-width: 90vw
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0)
        }

        .float-pts {
            position: fixed;
            z-index: 1250;
            transform: translateX(-50%);
            font-weight: 900;
            font-size: 23px;
            color: #1e8e3e;
            pointer-events: none;
            text-shadow: 0 2px 0 #fff;
            animation: floatUp 1.1s forwards
        }

        @keyframes floatUp {
            from {
                opacity: 1;
                transform: translate(-50%, 0)
            }

            to {
                opacity: 0;
                transform: translate(-50%, -52px)
            }
        }

        /* ============ WELCOME ============ */
        .welcome {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 13px;
            padding: 28px 16px;
            text-align: center
        }

        .rings {
            display: flex;
            flex-direction: column;
            margin-bottom: 2px
        }

        .rrow {
            display: flex
        }

        .rrow2 {
            display: flex;
            margin-top: -15px;
            margin-left: 26px
        }

        .r {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 7px solid
        }

        .r.b {
            border-color: #0081C8;
            margin-right: -13px
        }

        .r.k {
            border-color: #111;
            margin-right: -13px
        }

        .r.r {
            border-color: #EE334E
        }

        .r.y {
            border-color: #FCB131;
            margin-right: -13px
        }

        .r.g {
            border-color: #00A651
        }

        .game-title {
            font-size: clamp(42px, 8vw, 86px);
            line-height: 1.04;
            color: #ffcf33;
            -webkit-text-stroke: 2.5px #8a5400;
            text-shadow: 0 4px 0 #c8860a, 0 10px 26px rgba(160, 90, 0, .35);
            letter-spacing: 1px
        }

        .tagline {
            font-size: clamp(15px, 2.6vw, 21px);
            font-weight: 700;
            color: #33517a
        }

        .marquee {
            width: 100%;
            max-width: 900px;
            overflow: hidden;
            margin: 4px 0
        }

        .marquee-inner {
            display: inline-block;
            white-space: nowrap;
            font-size: 46px;
            animation: marq 22s linear infinite
        }

        @keyframes marq {
            to {
                transform: translateX(-25%)
            }
        }

        .namebox {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            margin-top: 4px
        }

        .namebox label {
            font-weight: 800;
            color: #33517a
        }

        .namebox input {
            font-family: inherit;
            font-size: 19px;
            padding: 12px 18px;
            border-radius: 14px;
            border: 3px solid #c9dbf5;
            text-align: center;
            width: min(400px, 86vw);
            outline: none
        }

        .namebox input:focus {
            border-color: #f4b41a;
            box-shadow: 0 0 0 4px rgba(244, 180, 26, .25)
        }

        .howto {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
            justify-content: center;
            font-weight: 700;
            color: #4a5f80;
            font-size: 14.5px
        }

        .welcome-tip {
            color: #5b6b82;
            font-weight: 600;
            font-size: 14px;
            max-width: 580px
        }

        /* ============ MAP ============ */
        .mapwrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 14px;
            gap: 12px;
            max-width: 1080px;
            margin: 0 auto
        }

        .mapbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, .88);
            border-radius: 18px;
            padding: 10px 14px;
            box-shadow: 0 8px 24px rgba(20, 50, 90, .12)
        }

        .mapbar-title {
            font-weight: 900;
            font-size: clamp(15px, 2.4vw, 21px);
            color: #1d2733;
            flex: 1
        }

        .mapbar-right {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .map-area {
            position: relative;
            flex: 1;
            min-height: 520px;
            border-radius: 26px;
            border: 5px solid #fff;
            box-shadow: 0 18px 50px rgba(20, 50, 90, .18);
            overflow: hidden;
            background: linear-gradient(#bfe6ff 0 58%, #8fd19e 58% 100%)
        }

        .map-decor {
            position: absolute;
            right: -34px;
            bottom: -46px;
            font-size: 230px;
            opacity: .15;
            transform: rotate(-8deg)
        }

        .map-sun {
            position: absolute;
            top: 14px;
            right: 16px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff6b0, #ffd23e);
            box-shadow: 0 0 30px #ffd23e99;
            animation: sunPulse 3.5s infinite
        }

        .map-path {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%
        }

        .flowpath {
            animation: dashFlow 1.4s linear infinite
        }

        @keyframes dashFlow {
            to {
                stroke-dashoffset: -13.2
            }
        }

        .node {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 86px;
            height: 86px;
            border-radius: 50%;
            border: 5px solid #fff;
            background: linear-gradient(#fff, #eef4fc);
            display: grid;
            place-items: center;
            font-size: 38px;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(20, 50, 90, .28);
            transition: transform .15s;
            padding: 0
        }

        .node:hover:not(.locked) {
            transform: translate(-50%, -50%) scale(1.12)
        }

        .node[data-n="7"] {
            background: linear-gradient(#ffe27a, #f4b41a)
        }

        .node.locked {
            background: linear-gradient(#e6ebf2, #cfd8e4);
            cursor: not-allowed;
            filter: grayscale(.5)
        }

        .node.next {
            animation: nodePulse 1.5s infinite
        }

        @keyframes nodePulse {

            0%,
            100% {
                box-shadow: 0 10px 22px rgba(20, 50, 90, .28), 0 0 0 0 rgba(244, 180, 26, .7)
            }

            60% {
                box-shadow: 0 10px 22px rgba(20, 50, 90, .28), 0 0 0 18px rgba(244, 180, 26, 0)
            }
        }

        .nnum {
            position: absolute;
            top: -6px;
            left: -6px;
            background: #1d2733;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 900;
            border: 3px solid #fff
        }

        .nstars {
            position: absolute;
            bottom: -12px;
            font-size: 14px;
            letter-spacing: 1px;
            text-shadow: 0 2px 3px rgba(0, 0, 0, .45);
            white-space: nowrap
        }

        .node-label {
            position: absolute;
            transform: translate(-50%, 46px);
            font-size: 13px;
            font-weight: 900;
            color: #23405e;
            background: rgba(255, 255, 255, .88);
            padding: 3px 10px;
            border-radius: 99px;
            white-space: nowrap;
            pointer-events: none
        }

        .big-trophy {
            position: absolute;
            left: 87%;
            top: 6%;
            transform: translate(-50%, -50%);
            font-size: 58px;
            animation: trophyBob 2s infinite;
            filter: drop-shadow(0 0 16px #ffd23ecc);
            z-index: 5
        }

        .map-actions {
            display: flex;
            justify-content: center;
            padding-bottom: 6px
        }

        @keyframes trophyBob {
            50% {
                transform: translate(-50%, -50%) translateY(-10px) scale(1.05)
            }
        }

        /* ============ GAME SHELL ============ */
        .gamewrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column
        }

        .theme-1 {
            --acc: #00A651
        }

        .theme-2 {
            --acc: #E8720C
        }

        .theme-3 {
            --acc: #0081C8
        }

        .theme-4 {
            --acc: #7B4FC9
        }

        .theme-5 {
            --acc: #0FA3A3
        }

        .theme-6 {
            --acc: #EE334E
        }

        .theme-7 {
            --acc: #C8930A
        }

        .gbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(6px);
            border-bottom: 3px solid #e0eaf5;
            position: sticky;
            top: 0;
            z-index: 40
        }

        .gbar-title {
            flex: 1;
            font-weight: 800;
            color: #22304a;
            font-size: clamp(14px, 2.2vw, 19px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .gbar-right {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .qmeta {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            margin: 12px 0 2px
        }

        .pbar {
            width: min(560px, 92%);
            height: 8px;
            background: #e2ebf5;
            border-radius: 99px;
            overflow: hidden
        }

        .pfill {
            height: 100%;
            background: var(--acc, #0081C8);
            border-radius: 99px;
            transition: width .4s
        }

        .dots {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 92%
        }

        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #d5e2f2
        }

        .dot.done {
            background: #2fb344
        }

        .dot.cur {
            background: var(--acc, #0081C8);
            transform: scale(1.3);
            box-shadow: 0 0 0 4px rgba(0, 129, 200, .16)
        }

        .qcount {
            font-weight: 800;
            color: #5b6b82;
            font-size: 14px
        }

        .stage {
            flex: 1;
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            padding: 14px 16px 44px;
            position: relative
        }

        /* ============ QUESTION CARD ============ */
        .q-card {
            background: #fff;
            border-radius: 26px;
            padding: 20px 22px;
            box-shadow: 0 16px 40px rgba(30, 60, 90, .16);
            border: 3px solid #eaf2fb;
            animation: slideUp .35s
        }

        .q-card.golden {
            border: 4px solid #f4b41a;
            background: linear-gradient(#fffdf5, #fff);
            box-shadow: 0 0 0 6px rgba(255, 210, 62, .35), 0 16px 40px rgba(180, 120, 0, .25);
            animation: goldGlow 1.6s infinite alternate
        }

        @keyframes goldGlow {
            from {
                box-shadow: 0 0 0 4px rgba(255, 210, 62, .3), 0 16px 40px rgba(180, 120, 0, .22)
            }

            to {
                box-shadow: 0 0 0 12px rgba(255, 210, 62, .12), 0 16px 40px rgba(180, 120, 0, .28)
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(18px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .q-prompt {
            font-size: clamp(18px, 2.6vw, 23px);
            font-weight: 800;
            color: #22304a;
            margin: 4px 0 6px;
            line-height: 1.35
        }

        .q-prompt.big {
            text-align: center;
            background: #f6faff;
            border: 2px solid #dbe7f5;
            border-radius: 14px;
            padding: 13px;
            margin: 8px 0 10px
        }

        .blank {
            color: #d33;
            border-bottom: 4px dotted #d33;
            padding: 0 6px
        }

        .sentence-line {
            display: block;
            margin-top: 6px;
            color: #0b6b2a
        }

        .interview {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            margin: 10px 0 8px
        }

        .avatar {
            width: 86px;
            height: 86px;
            flex: none;
            border-radius: 50%;
            background: #f1f5ff;
            border: 4px solid var(--acc, #7B4FC9);
            display: grid;
            place-items: center;
            font-size: 46px;
            animation: avPulse 2.5s infinite
        }

        @keyframes avPulse {
            50% {
                transform: scale(1.05)
            }
        }

        .bubble {
            position: relative;
            background: #fff;
            border: 3px solid var(--acc, #7B4FC9);
            border-radius: 18px;
            padding: 12px 16px;
            font-size: clamp(18px, 2.4vw, 22px);
            font-weight: 700;
            flex: 1;
            line-height: 1.4
        }

        .bubble::after {
            content: '';
            position: absolute;
            left: -16px;
            top: 28px;
            border: 9px solid transparent;
            border-right-color: var(--acc, #7B4FC9)
        }

        .who {
            color: var(--acc, #7B4FC9);
            font-weight: 900
        }

        .listenrow {
            text-align: center
        }

        .btn-listen {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 4px auto 10px;
            background: #e0f7fa;
            border: 3px solid #26c6da;
            color: #006064;
            border-radius: 999px;
            padding: 10px 24px;
            font-size: 19px;
            font-weight: 800;
            cursor: pointer;
            animation: glowPulse 2s infinite
        }

        @keyframes glowPulse {
            50% {
                box-shadow: 0 0 0 9px rgba(38, 198, 218, .15)
            }
        }

        .speedbar {
            height: 10px;
            background: #e7edf5;
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 14px
        }

        .speedfill {
            height: 100%;
            width: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, #ffd23e, #ff8a3e)
        }

        .speedbar.low .speedfill {
            background: linear-gradient(90deg, #ff8a3e, #ee334e)
        }

        .opts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px;
            margin: 14px 0 6px
        }

        .opts.chips {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center
        }

        .opt {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f2f7ff;
            border: 3px solid #d6e6fb;
            border-radius: 16px;
            padding: 13px 16px;
            font-size: 18.5px;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: .15s;
            color: #1d2733
        }

        .opt:hover:not(:disabled) {
            transform: translateY(-3px);
            border-color: var(--acc, #0081C8);
            background: #e8f2ff
        }

        .opt:disabled {
            cursor: default
        }

        .opt-letter {
            background: var(--acc, #0081C8);
            color: #fff;
            min-width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 17px;
            flex: none
        }

        .opt-txt {
            flex: 1
        }

        .opts.chips .opt {
            border-radius: 999px;
            padding: 11px 26px;
            font-size: 21px;
            justify-content: center;
            background: #fff
        }

        .opts.chips .opt-letter {
            display: none
        }

        .opt.right {
            background: #e3f9e5;
            border-color: #2fb344;
            animation: popIn .4s
        }

        .opt.right .opt-letter {
            background: #2fb344
        }

        .opt.dead {
            opacity: .45;
            text-decoration: line-through;
            animation: shake .4s
        }

        @keyframes popIn {
            0% {
                transform: scale(.5);
                opacity: 0
            }

            70% {
                transform: scale(1.1)
            }

            100% {
                transform: scale(1)
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            20%,
            60% {
                transform: translateX(-7px)
            }

            40%,
            80% {
                transform: translateX(7px)
            }
        }

        .fb-good {
            margin-top: 14px;
            border-radius: 18px;
            padding: 15px 18px;
            background: linear-gradient(120deg, #e8fbef, #d5f5e0);
            border: 3px solid #35c65c;
            animation: slideUp .35s;
            text-align: center
        }

        .fb-title {
            font-size: 25px;
            font-weight: 900;
            color: #1e8e3e
        }

        .fb-explain {
            margin: 9px 0 13px;
            font-size: 17px;
            background: #fff;
            border-radius: 12px;
            padding: 10px 13px;
            border: 2px dashed #9fdcab;
            line-height: 1.45
        }

        .fb-hint {
            margin-top: 10px;
            background: #fff4e5;
            border: 2px dashed #ffb35c;
            color: #a05a00;
            border-radius: 14px;
            padding: 10px 14px;
            font-weight: 700;
            animation: shake .35s;
            line-height: 1.4
        }

        .rule-banner {
            background: linear-gradient(90deg, #fff3f5, #ffe9ee);
            border: 3px dashed #ee334e;
            color: #a30020;
            border-radius: 16px;
            padding: 9px 15px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 13px;
            font-size: 17px
        }

        .wrongline {
            background: #ffe3e3;
            border: 3px dashed #ee334e;
            border-radius: 14px;
            padding: 9px 14px;
            font-weight: 800;
            color: #b00020;
            text-decoration: line-through;
            text-align: center;
            margin-bottom: 13px;
            font-size: 18px
        }

        /* ============ SCENES (the pictures!) ============ */
        .scene {
            position: relative;
            height: 225px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 26px rgba(20, 50, 90, .2);
            margin: 0 0 15px
        }

        .bg-pitch {
            background: linear-gradient(#9fd8f9 0 34%, #3f9e55 34% 34.6%, #37904c 34.6% 100%)
        }

        .bg-pitch::before {
            content: '';
            position: absolute;
            inset: 34.6% 0 0 0;
            background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .07) 0 46px, transparent 46px 92px)
        }

        .bg-pool {
            background: linear-gradient(#c7ecff 0 40%, #54c0f2 40% 100%)
        }

        .bg-stage {
            background: linear-gradient(#ffe9b8 0 60%, #f2b95c 60% 100%)
        }

        .bg-room {
            background: linear-gradient(#42536e 0 72%, #2c3a52 72% 100%)
        }

        .bg-track {
            background: linear-gradient(#a5d8f5 0 32%, #e8703f 32% 100%)
        }

        .bg-track::before {
            content: '';
            position: absolute;
            inset: 32% 0 0 0;
            background: repeating-linear-gradient(180deg, transparent 0 26px, rgba(255, 255, 255, .6) 26px 30px)
        }

        .bg-gym {
            background: linear-gradient(#eef3fa 0 70%, #c3d1e6 70% 100%)
        }

        .bg-skyout {
            background: linear-gradient(#bfe6ff 0 62%, #7cc98f 62% 100%)
        }

        .bg-court {
            background: linear-gradient(#f7ddad, #f7ddad)
        }

        .bg-court::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg, rgba(140, 90, 40, .12) 0 50px, transparent 50px 100px), linear-gradient(transparent 70%, rgba(255, 255, 255, .75) 70%, rgba(255, 255, 255, .75) 72.5%, transparent 72.5%)
        }

        .crowd {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: radial-gradient(circle at 8px 8px, rgba(255, 255, 255, .85) 3px, transparent 4px), radial-gradient(circle at 20px 16px, rgba(255, 215, 150, .8) 3px, transparent 4px), linear-gradient(#4a5568, #2d3748);
            background-size: 26px 26px, 26px 26px, 100% 100%
        }

        .sun {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff6b0, #ffd23e);
            box-shadow: 0 0 26px #ffd23e99;
            animation: sunPulse 3s infinite;
            z-index: 1
        }

        @keyframes sunPulse {
            50% {
                transform: scale(1.08)
            }
        }

        .cloud {
            position: absolute;
            width: 74px;
            height: 20px;
            background: #fff;
            border-radius: 20px;
            opacity: .92;
            z-index: 1
        }

        .cloud::before {
            content: '';
            position: absolute;
            width: 32px;
            height: 32px;
            background: #fff;
            border-radius: 50%;
            top: -15px;
            left: 12px
        }

        .cloud::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            top: -11px;
            right: 14px
        }

        .c1 {
            top: 20px;
            left: 8%;
            animation: drift 13s ease-in-out infinite alternate
        }

        .c2 {
            top: 36px;
            left: 54%;
            animation: drift 17s ease-in-out infinite alternate-reverse
        }

        @keyframes drift {
            from {
                margin-left: 0
            }

            to {
                margin-left: 46px
            }
        }

        .sc {
            position: absolute;
            font-size: 58px;
            line-height: 1;
            filter: drop-shadow(0 6px 8px rgba(0, 0, 0, .25));
            z-index: 2
        }

        .scene-label {
            position: absolute;
            left: 10px;
            bottom: 10px;
            background: rgba(15, 25, 40, .75);
            color: #fff;
            padding: 5px 14px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 13.5px;
            z-index: 3;
            letter-spacing: .3px
        }

        .lanerope {
            position: absolute;
            left: 0;
            right: 0;
            height: 6px;
            background: repeating-linear-gradient(90deg, #ff6b6b 0 20px, #fff 20px 40px);
            opacity: .8;
            z-index: 1
        }

        .waves {
            position: absolute;
            top: calc(40% - 18px);
            left: 0;
            width: 100%;
            height: 36px;
            z-index: 1
        }

        .waves .w2 {
            animation: waveShift 3.5s ease-in-out infinite alternate
        }

        @keyframes waveShift {
            from {
                transform: translateX(0)
            }

            to {
                transform: translateX(-22px)
            }
        }

        .podium {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 6px;
            z-index: 1
        }

        .pod {
            width: 56px;
            border-radius: 8px 8px 0 0;
            display: grid;
            place-items: start center;
            padding-top: 6px;
            font-weight: 900;
            font-size: 20px;
            border: 3px solid rgba(255, 255, 255, .6)
        }

        .pod1 {
            height: 84px;
            background: linear-gradient(#ffe27a, #f4b41a);
            color: #7a5b00
        }

        .pod2 {
            height: 58px;
            background: linear-gradient(#f4f7fa, #c3ccd6);
            color: #4a5568
        }

        .pod3 {
            height: 42px;
            background: linear-gradient(#f3c9a5, #cd7f32);
            color: #5c3317
        }

        .tv {
            position: absolute;
            right: 8%;
            bottom: 14%;
            width: 150px;
            z-index: 1
        }

        .tv-screen {
            height: 88px;
            background: radial-gradient(circle at 50% 40%, #3b6ea5, #16233a);
            border: 9px solid #2c3a4f;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 40px;
            box-shadow: 0 0 34px rgba(79, 195, 247, .35)
        }

        .tv-stand {
            width: 44px;
            height: 14px;
            background: #2c3a4f;
            margin: -2px auto 0;
            border-radius: 0 0 8px 8px
        }

        .mat {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            width: 46%;
            height: 20px;
            background: linear-gradient(#5b7fe0, #3d5cc0);
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, .2)
        }

        .a-runbounce {
            animation: runbounce .5s ease-in-out infinite
        }

        @keyframes runbounce {

            0%,
            100% {
                transform: translateY(0) rotate(-4deg)
            }

            50% {
                transform: translateY(-11px) rotate(5deg)
            }
        }

        .a-ballfly {
            animation: ballfly 1.9s ease-in infinite
        }

        @keyframes ballfly {
            0% {
                transform: translate(0, 0) rotate(0)
            }

            55% {
                transform: translate(170px, -52px) rotate(380deg)
            }

            100% {
                transform: translate(235px, 6px) rotate(560deg);
                opacity: .25
            }
        }

        .a-bob {
            animation: bobble 2.2s ease-in-out infinite
        }

        @keyframes bobble {

            0%,
            100% {
                transform: translateY(0) rotate(-5deg)
            }

            50% {
                transform: translateY(-9px) rotate(6deg)
            }
        }

        .a-cheer {
            animation: cheer .8s ease-in-out infinite
        }

        @keyframes cheer {

            0%,
            100% {
                transform: translateY(0) scale(1)
            }

            45% {
                transform: translateY(-16px) scale(1.08)
            }
        }

        .a-swing {
            animation: swing 1.7s ease-in-out infinite
        }

        @keyframes swing {

            0%,
            100% {
                transform: rotate(-26deg)
            }

            50% {
                transform: rotate(26deg)
            }
        }

        .a-floatsmall {
            font-size: 30px;
            animation: floatY 2.8s ease-in-out infinite
        }

        @keyframes floatY {
            50% {
                transform: translateY(-10px)
            }
        }

        .a-bounce {
            animation: floatY 1.6s ease-in-out infinite
        }

        /* ============ STORY CARDS ============ */
        .storycard {
            position: relative;
            height: 190px;
            border-radius: 20px;
            overflow: hidden;
            display: grid;
            place-items: center;
            margin-bottom: 15px;
            box-shadow: 0 10px 26px rgba(20, 50, 90, .2)
        }

        .storypic {
            font-size: 92px;
            filter: drop-shadow(0 12px 16px rgba(0, 0, 0, .3));
            animation: floatY 2.6s ease-in-out infinite
        }

        .storychapter {
            position: absolute;
            top: 10px;
            left: 12px;
            background: rgba(10, 20, 35, .7);
            color: #fff;
            padding: 4px 12px;
            border-radius: 99px;
            font-weight: 800;
            font-size: 13px
        }

        .bg-water {
            background: linear-gradient(135deg, #54c0f2, #0277bd)
        }

        .bg-gym2 {
            background: linear-gradient(135deg, #ffb74d, #e65100)
        }

        .bg-stadium2 {
            background: linear-gradient(135deg, #90caf9, #283593)
        }

        .bg-dark {
            background: linear-gradient(135deg, #78909c, #37474f)
        }

        .bg-fire {
            background: linear-gradient(135deg, #ff8a65, #d84315)
        }

        .bg-gold {
            background: linear-gradient(135deg, #ffe082, #ff8f00)
        }

        .bg-studio {
            background: linear-gradient(135deg, #ce93d8, #6a1b9a)
        }

        /* ============ SORTING (Levels 2 & 5) ============ */
        .sort-head {
            text-align: center;
            margin-bottom: 10px
        }

        .sort-head h2 {
            font-size: clamp(22px, 3.4vw, 30px);
            color: #20344c
        }

        .sort-head p {
            color: #5b6b82;
            font-weight: 700
        }

        .sort-count {
            text-align: center;
            font-weight: 800;
            color: #20344c;
            margin-bottom: 10px
        }

        .card-tray {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            padding: 16px;
            background: rgba(255, 255, 255, .78);
            border-radius: 22px;
            border: 3px dashed #c3d6ee;
            margin-bottom: 16px
        }

        .vcard {
            position: relative;
            width: 116px;
            padding: 10px 6px;
            background: linear-gradient(#fff, #f0f6ff);
            border: 3px solid #cddcf3;
            border-radius: 18px;
            text-align: center;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            box-shadow: 0 5px 0 rgba(20, 50, 90, .08);
            transition: transform .15s
        }

        .vcard:hover {
            transform: translateY(-4px)
        }

        .vcard .ve {
            display: block;
            font-size: 32px
        }

        .vcard .vw {
            display: block;
            font-size: 20px;
            font-weight: 800;
            color: #173a63;
            margin-top: 2px
        }

        .vcard .vh {
            display: block;
            font-size: 11.5px;
            color: #8aa0bd;
            font-weight: 700;
            margin-top: 2px
        }

        .vcard.solved {
            border-color: #2fb344;
            background: linear-gradient(#eafbf0, #d2f5dc)
        }

        .vcard.selected {
            border-color: #f4b41a;
            box-shadow: 0 0 0 5px rgba(244, 180, 26, .35);
            transform: translateY(-6px)
        }

        .vcard.drag-src {
            opacity: .25
        }

        .vcard.shake {
            animation: shake .4s
        }

        .ghost-card {
            position: fixed;
            z-index: 1250;
            pointer-events: none;
            transform: scale(1.08) rotate(3deg);
            opacity: .95;
            margin: 0
        }

        .speak-mini {
            position: absolute;
            top: 5px;
            right: 5px;
            border: none;
            background: #dbe9fb;
            border-radius: 50%;
            width: 27px;
            height: 27px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1
        }

        .zones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px
        }

        .zones3 {
            grid-template-columns: repeat(3, 1fr)
        }

        .zone {
            min-height: 180px;
            border-radius: 22px;
            border: 4px dashed #b9c9de;
            background: rgba(255, 255, 255, .82);
            padding: 12px;
            text-align: center;
            transition: transform .15s, box-shadow .15s
        }

        .zone.drop-hover {
            transform: scale(1.03);
            box-shadow: 0 0 0 7px rgba(244, 180, 26, .4)
        }

        .zone-head {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: .5px
        }

        .zone-sub {
            font-size: 14.5px;
            font-weight: 700;
            color: #5b6b82;
            margin-top: 2px
        }

        .zone-ex {
            font-size: 14px;
            color: #5b6b82;
            margin-top: 4px;
            font-weight: 700
        }

        .zone-r {
            border-color: #0081C8;
            background: linear-gradient(rgba(232, 244, 255, .94), rgba(214, 235, 255, .94))
        }

        .zone-r .zone-head {
            color: #0069a8
        }

        .zone-i {
            border-color: #EE334E;
            background: linear-gradient(rgba(255, 238, 241, .94), rgba(255, 219, 226, .94))
        }

        .zone-i .zone-head {
            color: #c21f3d
        }

        .zone-t {
            border-color: #5b7fb4
        }

        .zone-t .zone-head {
            color: #42648f
        }

        .zone-t .eq {
            color: #5b7fb4
        }

        .zone-d {
            border-color: #c26a2e
        }

        .zone-d .zone-head {
            color: #9c521d
        }

        .zone-d .eq {
            color: #c26a2e
        }

        .zone-id {
            border-color: #b03a6b
        }

        .zone-id .zone-head {
            color: #8f2c54
        }

        .zone-id .eq {
            color: #b03a6b
        }

        .eq {
            display: flex;
            gap: 3px;
            align-items: flex-end;
            height: 20px;
            justify-content: center;
            margin-top: 6px
        }

        .eq i {
            width: 5px;
            background: currentColor;
            height: 6px;
            border-radius: 3px;
            animation: eqb .8s ease-in-out infinite
        }

        .eq i:nth-child(2) {
            animation-delay: .12s
        }

        .eq i:nth-child(3) {
            animation-delay: .24s
        }

        .eq i:nth-child(4) {
            animation-delay: .36s
        }

        .eq i:nth-child(5) {
            animation-delay: .48s
        }

        @keyframes eqb {
            50% {
                height: 20px
            }
        }

        .collected {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 10px;
            min-height: 32px
        }

        .chip-verb {
            background: #fff;
            border: 2px solid #9ec3ef;
            border-radius: 99px;
            padding: 3px 10px;
            font-weight: 800;
            font-size: 13.5px;
            animation: popIn .3s;
            color: #173a63;
            display: inline-block
        }

        .chip-verb.ch-i {
            border-color: #f4a3b1;
            color: #c21f3d
        }

        .sort-hint {
            min-height: 40px;
            text-align: center;
            font-weight: 700;
            color: #a05a00;
            background: #fff4e5;
            border: 2px dashed #ffb35c;
            border-radius: 14px;
            margin-top: 14px;
            padding: 8px 12px;
            line-height: 1.4
        }

        /* ============ WORD ORDER ============ */
        .order-answer {
            min-height: 70px;
            border: 3px dashed #b9c9de;
            border-radius: 16px;
            background: #f8fbff;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            padding: 10px;
            margin: 12px 0
        }

        .order-answer.ansright {
            border-color: #2fb344;
            background: #f0fff3
        }

        .order-answer.shake {
            animation: shake .4s
        }

        .order-hint {
            color: #8aa0bd;
            font-weight: 700
        }

        .order-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding: 12px;
            background: rgba(255, 255, 255, .75);
            border-radius: 16px;
            border: 3px solid #e3ecf7;
            min-height: 56px
        }

        .wchip {
            background: #eef4fd;
            border: 3px solid #c6d8f2;
            border-radius: 14px;
            padding: 9px 16px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            color: #173a63;
            box-shadow: 0 4px 0 rgba(20, 50, 90, .08);
            transition: transform .12s
        }

        .wchip:hover {
            transform: translateY(-3px)
        }

        .wchip.achip {
            border-color: #8ee6a1;
            background: #effff3
        }

        .wchip .x {
            opacity: .45;
            font-size: 13px;
            margin-left: 6px
        }

        .order-actions {
            text-align: center;
            margin-top: 12px
        }

        .checkbtn {
            font-size: 20px
        }

        .checkbtn:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        /* ============ ROUND OVERLAY / RECAPS ============ */
        .round-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, .9);
            display: grid;
            place-items: center;
            z-index: 30;
            border-radius: 26px
        }

        .round-card {
            background: #fff;
            border: 4px solid #f4b41a;
            border-radius: 24px;
            padding: 32px 42px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .15)
        }

        .round-big {
            font-size: 32px;
            font-weight: 900;
            color: #c8860a;
            margin-bottom: 8px
        }

        .recap-title {
            text-align: center;
            font-size: clamp(22px, 3.5vw, 32px);
            color: #20344c;
            margin-bottom: 14px
        }

        .recap-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 18px
        }

        .recap-cols.cols3 {
            grid-template-columns: repeat(3, 1fr)
        }

        .recap-col {
            background: #f8fbff;
            border: 3px solid #dbe7f5;
            border-radius: 18px;
            padding: 12px;
            text-align: center
        }

        .recap-col h3 {
            font-size: 17px;
            margin-bottom: 10px
        }

        .recap-col.r h3 {
            color: #0069a8
        }

        .recap-col.i h3 {
            color: #c21f3d
        }

        .recap-col .chip-verb {
            margin: 3px
        }

        .story-final p {
            font-size: 18px;
            margin: 7px 0;
            background: #f8fbff;
            border-radius: 12px;
            padding: 8px 12px;
            border: 2px solid #e3ecf7;
            text-align: left
        }

        .story-final b {
            color: #0b6b2a
        }

        .story-final b.neg {
            color: #c21f3d
        }

        .qline {
            font-style: italic
        }

        .intro-card {

            border-radius: 26px;
            padding: 24px 28px;

        .intro-arena {

        }

        .intro-head {

            align-items: center;
            gap: 16px;
            margin: 12px 0

        .intro-num {

            height: 64px;

        .intro-head p {

            width: 64px;
            height: 64px;
            font-size: 40px;

            border: 3px solid #bfe8f7

        .coach-bubble {
            font-size: 16.5px;
            font-weight: 600;

        }

        .example-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 16px 0
        }

        .exchip {
            border: 2px solid #ffd98a;
            background: linear-gradient(#fffdf3, #fff3d6);

            padding: 6px 14px;
            font-weight: 800;
            color: #8a5a00;

        .timeline {

        .tl-past {

            border: 3px solid #2fb344;
            border-radius: 14px;
            padding: 8px 10px;
            text-align: center
        }

        .tl-now {
            flex: 1;
            background: #f1f4f8;
            border: 3px dashed #b9c9de;
            border-radius: 14px;
            padding: 8px 10px;
            text-align: center;
            color: #8b9bb0

        .tl-past b,
        .tl-now b {
            display: block;
            font-size: 15px

        .tl-past span,
        .tl-now span {
            font-size: 12.5px;
            font-weight: 700
        }

        .tl-arrow {
            align-self: center;
            font-size: 22px;
            color: #8b9bb0

    <script>
        'use strict';

        const APP = document.getElementById('app');
        function $(s) { return document.querySelector(s) }
        function el(h) { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild }
        function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]] } return a }
        function pick(a) { return a[Math.floor(Math.random() * a.length)] }
        const stripHTML = s => String(s).replace(/<[^>]*>/g, ' ').replace(/_{3,}/g, ' blank ').replace(/\s+/g, ' ').trim();

        /* ================= STATE ================= */
        const SAVE_KEY = 'pastSimpleChampions_v2';

            }
        }
        let state = (() => { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.v === 2) return s } catch (e) { } return defaultState() })();
        function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)) } catch (e) { } }
        let levelStartScore = 0;

        const BADGE_DEFS = [
            { key: 'perfect', icon: '🌟', name: 'Perfect Level', need: 'Get 3 stars in any level' },
            { key: 'speed', icon: '⚡', name: 'Speed Star', need: 'Earn 5 speed bonuses' },
            { key: 'storyteller', icon: '📖', name: 'Story Teller', need: '3 stars in the Olympic Story' },
            { key: 'champion', icon: '🏆', name: 'True Champion', need: 'Complete all 7 levels' }];

        /* ================= AUDIO ================= */
        let AC = null;
        function ac() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC }
        function beep(freq, start, dur, type, vol) {
            if (state.muted) return; try {
                const c = ac(), o = c.createOscillator(), g = c.createGain(); o.type = type || 'triangle'; o.frequency.value = freq;
                g.gain.setValueAtTime(.0001, c.currentTime + start); g.gain.exponentialRampToValueAtTime(vol || .16, c.currentTime + start + .02); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + start + dur);
                o.connect(g); g.connect(c.destination); o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + .05)
            } catch (e) { }
        }
        const sfx = {
            click: () => beep(700, 0, .06, 'square', .05),
            correct: () => { beep(523, 0, .12); beep(659, .09, .12); beep(784, .18, .12); beep(1047, .27, .28) },
            wrong: () => { beep(220, 0, .18, 'sawtooth', .07); beep(170, .14, .22, 'sawtooth', .07) },
            bonus: () => { beep(880, 0, .08); beep(1175, .08, .14) },
            star: i => beep(660 + i * 180, 0, .28, 'sine', .2),
            fanfare: () => { [523, 523, 523, 659, 784, 1047].forEach((f, i) => beep(f, i * .13, .2, 'triangle', .15)); beep(1319, .85, .55, 'triangle', .17) }
        };
        function speak(text, rate) {
            if (state.muted || !('speechSynthesis' in window) || !text) return; try {
                speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; u.rate = rate || .95;
                const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.indexOf('en') === 0); if (v) u.voice = v; speechSynthesis.speak(u)
            } catch (e) { }
        }
        function toggleMute() { state.muted = !state.muted; save(); document.querySelectorAll('.btn-mute').forEach(b => b.textContent = state.muted ? '🔇' : '🔊'); if (!state.muted) sfx.click() }

        /* ================= CONFETTI & TOAST ================= */
        let confettiRAF = null;
        function confettiBurst(n, ms) {
            const cvs = document.getElementById('confetti'), ctx = cvs.getContext('2d');
            cvs.width = innerWidth; cvs.height = innerHeight; const colors = ['#FFD700', '#EE334E', '#0081C8', '#00A651', '#FCB131', '#ffffff'], parts = [];
            for (let i = 0; i < (n || 120); i++)parts.push({
                x: Math.random() * cvs.width, y: -20 - Math.random() * cvs.height * .35, w: 6 + Math.random() * 8, h: 8 + Math.random() * 10,
                vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3.5, rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .22, color: colors[i % colors.length]
            });
            cancelAnimationFrame(confettiRAF); const t0 = performance.now();
            (function frame(t) {
                ctx.clearRect(0, 0, cvs.width, cvs.height);
                for (const p of parts) { p.x += p.vx; p.y += p.vy; p.rot += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore() }
                if (t - t0 < (ms || 2200)) confettiRAF = requestAnimationFrame(frame); else ctx.clearRect(0, 0, cvs.width, cvs.height)
            })(t0)
        }
        function toast(msg, ms) {
            const t = el(`<div class="toast">${msg}</div>`); document.getElementById('toast-layer').appendChild(t);
            requestAnimationFrame(() => t.classList.add('show')); setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400) }, ms || 2200)
        }

        function floatPts(txt) {

            document.body.appendChild(f); setTimeout(() => f.remove(), 1100)

        function addScore(pts) {
            state.score += pts; save(); document.querySelectorAll('.score-val').forEach(e => e.textContent = state.score);
            const chip = document.querySelector('.score-chip'); if (chip) { chip.classList.remove('pulse'); void chip.offsetWidth; chip.classList.add('pulse') } floatPts('+' + pts)
        }
        function recordSkill(k, first) { if (!k || !state.skills[k]) return; state.skills[k].t++; if (first) state.skills[k].c++; save() }
        function grantBadge(key) {
            if (state.badges[key]) return; state.badges[key] = true; save();
            const b = BADGE_DEFS.find(x => x.key === key); if (b) { toast(`${b.icon} BADGE UNLOCKED: ${b.name}!`, 3000); sfx.bonus() }
        }

        const DragSys = { active: null }; let selectedCard = null;
        function zoneAt(x, y) { const els = document.elementsFromPoint(x, y); for (const e of els) { if (e.classList && e.classList.contains('dropzone')) return e } return null }
        function makeDraggable(card, onDrop) {
            card._onDrop = onDrop;
            card.addEventListener('pointerdown', e => {
                if (DragSys.active) return; if (e.target.closest('button')) return;
                if (card._placed || card.classList.contains('solved')) return; e.preventDefault();
                try { card.setPointerCapture(e.pointerId) } catch (err) { }
                DragSys.active = { card, startX: e.clientX, startY: e.clientY, moved: false, ghost: null }
            })
        }
        document.addEventListener('pointermove', e => {
            const d = DragSys.active; if (!d) return;
            if (!d.moved) {
                if (Math.hypot(e.clientX - d.startX, e.clientY - d.startY) < 10) return; d.moved = true;
                const g = d.card.cloneNode(true); g.classList.add('ghost-card'); g.classList.remove('selected'); g.style.width = d.card.getBoundingClientRect().width + 'px';
                document.body.appendChild(g); d.ghost = g; d.card.classList.add('drag-src')
            }
            e.preventDefault();
            d.ghost.style.left = (e.clientX - d.ghost.offsetWidth / 2) + 'px'; d.ghost.style.top = (e.clientY - d.ghost.offsetHeight / 2) + 'px';
            document.querySelectorAll('.dropzone.drop-hover').forEach(x => x.classList.remove('drop-hover'));
            const z = zoneAt(e.clientX, e.clientY); if (z) z.classList.add('drop-hover')
        }, { passive: false });
        document.addEventListener('pointerup', e => {
            const d = DragSys.active; if (!d) return; DragSys.active = null;
            document.querySelectorAll('.dropzone.drop-hover').forEach(x => x.classList.remove('drop-hover'));
            if (d.moved) {
                if (d.ghost) d.ghost.remove(); d.card.classList.remove('drag-src');
                const z = zoneAt(e.clientX, e.clientY); if (z && d.card._onDrop) { try { d.card._onDrop(d.card, z) } catch (err) { } }
            }
            else {
                if (selectedCard === d.card) { d.card.classList.remove('selected'); selectedCard = null; return }

        function askMC(cfg) {
            const { mount, scene = '', prompt, interview = null, options, correct, explain, skill, chips = false, speakWord = null, golden = false, sentence = false, onNext, onResult } = cfg;
            let attempts = 0, done = false; const t0 = performance.now(); const letters = ['A', 'B', 'C', 'D'];
            let head = interview ? `<div class="interview"><div class="avatar">${interview.avatar}</div><div class="bubble"><span class="who">${interview.name}:</span> ${prompt} <button class="btn-speak" title="Listen">🔊</button></div></div>`
                : `<div class="q-prompt ${sentence ? 'big' : ''}">${prompt} <button class="btn-speak" title="Listen">🔊</button></div>`;
            if (speakWord) head += `<div class="listenrow"><button class="btn-listen">🔊 Listen: “${speakWord}”</button></div>`;
            mount.innerHTML = `<div class="q-card ${golden ? 'golden' : ''}">${scene ? scene : ''}${head}<div class="opts ${chips ? 'chips' : ''}"></div><div class="fbzone"></div></div>`;
            const qcard = mount.querySelector('.q-card'); const timer = startSpeedTimer(qcard);
            const sp = mount.querySelector('.btn-speak'); if (sp) sp.onclick = () => speak(stripHTML(prompt));
            const bl = mount.querySelector('.btn-listen'); if (bl) bl.onclick = () => speak(speakWord, .75);
            const optsEl = mount.querySelector('.opts'), fbzone = mount.querySelector('.fbzone');
            options.forEach((opt, i) => {
                const b = el(`<button class="opt"><span class="opt-letter">${letters[i]}</span><span class="opt-txt">${opt}</span></button>`);

                    if (done) return; const fast = (performance.now() - t0) < 8000; timer.stop();
                    if (i === correct) {
                        done = true; const first = attempts === 0; let pts = first ? 10 : (attempts === 1 ? 5 : 2);
                        if (first && fast) { pts += 5; state.speedBonuses++; if (state.speedBonuses >= 5) grantBadge('speed'); toast('⚡ SPEED BONUS! +5', 1500) }
                        addScore(pts); recordSkill(skill, first); if (onResult) onResult(first);
                        b.classList.add('right'); mount.querySelectorAll('.opt').forEach(o => o.disabled = true);
                        sfx.correct(); if (first) confettiBurst(70, 1500);
                        const cheer = pick(['GOAL! ⚽', 'FANTASTIC! 🌟', 'CHAMPION MOVE! 🏆', 'PERFECT! 🎉', 'SUPER! 👏', 'BRILLIANT! 💡']);
                        fbzone.innerHTML = `<div class="fb-good"><div class="fb-title">${cheer} &nbsp;+${pts} points</div><div class="fb-explain">${explain}</div><button class="btn btn-green fb-next">NEXT ▶</button></div>`;

                    }
                    else {

        }

        /* ================= WORD-ORDER COMPONENT ================= */
        function askOrder(cfg) {
            const { mount, prompt, interview = null, words, explain, skill, golden = false, onNext, onResult } = cfg;
            let attempts = 0; const t0 = performance.now();
            let bank = shuffle(words); if (bank.join(' ') === words.join(' ')) bank = shuffle(bank);
            const used = new Array(bank.length).fill(false); const picked = [];
            const head = interview ? `<div class="interview"><div class="avatar">${interview.avatar}</div><div class="bubble"><span class="who">${interview.name}:</span> ${prompt} <button class="btn-speak">🔊</button></div></div>`
                : `<div class="q-prompt big">${prompt} <button class="btn-speak">🔊</button></div>`;
            mount.innerHTML = `<div class="q-card ${golden ? 'golden' : ''}">${head}<div class="order-answer"></div><div class="order-bank"></div>
<div class="order-actions"><button class="btn btn-green checkbtn" disabled>✔ CHECK</button></div><div class="fbzone"></div></div>`;
            const timer = startSpeedTimer(mount.querySelector('.q-card'));
            const sp = mount.querySelector('.btn-speak'); if (sp) sp.onclick = () => speak(stripHTML(prompt));
            const ansEl = mount.querySelector('.order-answer'), bankEl = mount.querySelector('.order-bank'),
                chk = mount.querySelector('.checkbtn'), fbzone = mount.querySelector('.fbzone');
            function render() {
                ansEl.innerHTML = picked.length ? '' : '<span class="order-hint">👆 Tap the words below to build the question…</span>';
                picked.forEach((p, i) => {
                    const c = el(`<button class="wchip achip">${p.word}<span class="x">✕</span></button>`);
                    c.onclick = () => { picked.splice(i, 1); used[p.bi] = false; render(); sfx.click() }; ansEl.appendChild(c)
                });
                bankEl.innerHTML = ''; bank.forEach((w, i) => {
                    if (used[i]) return; const c = el(`<button class="wchip">${w}</button>`);
                    c.onclick = () => { used[i] = true; picked.push({ word: w, bi: i }); render(); sfx.click() }; bankEl.appendChild(c)
                });
                chk.disabled = picked.length !== words.length
            }
            render();
            chk.onclick = () => {
                if (chk.disabled) return; const fast = (performance.now() - t0) < 8000;
                if (picked.map(p => p.word).join(' ') === words.join(' ')) {
                    timer.stop();
                    const first = attempts === 0; let pts = first ? 10 : (attempts === 1 ? 5 : 2);
                    if (first && fast) { pts += 5; state.speedBonuses++; if (state.speedBonuses >= 5) grantBadge('speed'); toast('⚡ SPEED BONUS! +5', 1500) }
                    addScore(pts); recordSkill(skill, first); if (onResult) onResult(first);
                    sfx.correct(); confettiBurst(90, 1800); ansEl.classList.add('ansright');
                    const disp = words.join(' ').replace(' ?', '?');
                    fbzone.innerHTML = `<div class="fb-good"><div class="fb-title">PERFECT QUESTION! 🎤 +${pts} points</div><div class="fb-explain">✅ <b>${disp}</b><br>${explain}</div><button class="btn btn-green fb-next">NEXT ▶</button></div>`;
                    const nb = fbzone.querySelector('.fb-next'); nb.onclick = () => { sfx.click(); onNext() }; nb.focus()
                }
                else {
                    attempts++; timer.stop(); sfx.wrong();
                    ansEl.classList.remove('shake'); void ansEl.offsetWidth; ansEl.classList.add('shake');
                    const hints = ["Hmm! A past simple question starts with <b>Did</b> or a question word (What, Where…)!",
                        "Word order: <b>Did + person + base verb</b> + the rest!", "Almost! Move some words around and check again! 🌟"];
                    fbzone.innerHTML = `<div class="fb-hint">❌ ${hints[Math.min(attempts - 1, 2)]}</div>`
                }
            }
        }

            const totalStars = [1, 2, 3, 4, 5, 6, 7].reduce((a, n) => a + (state.levelStars[n] || 0), 0);
            const allDone = [1, 2, 3, 4, 5, 6, 7].every(k => state.completed[k]);
            const nodes = [{ x: 11, y: 79 }, { x: 27, y: 61 }, { x: 44, y: 78 }, { x: 60, y: 56 }, { x: 74, y: 77 }, { x: 85, y: 51 }, { x: 87, y: 25 }];
            const pathD = 'M11,79 C17,75 22,66 27,61 C33,56 39,80 44,78 C51,76 56,62 60,56 C65,50 70,81 74,77 C79,73 82,57 85,51 C89,45 89,32 87,25';
            APP.innerHTML = `<div class="mapwrap">
<header class="mapbar"><div class="mapbar-title">🏆 PAST SIMPLE CHAMPIONS</div>
<div class="mapbar-right">
<span class="chip">👤 ${state.name || 'Champion'}</span><span class="chip">⭐ ${state.score}</span><span class="chip">🏅 ${totalStars}/21</span>
<button class="btn-mini btn-mute">${state.muted ? '🔇' : '🔊'}</button><button class="btn-mini" id="btn-reset" title="New game">🗑️</button></div></header>
<div class="map-area"><div class="map-sun"></div><div class="map-decor">🏟️</div>
<svg class="map-path" viewBox="0 0 100 100" preserveAspectRatio="none"><path class="flowpath" d="${pathD}" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-dasharray="4 2.6" vector-effect="non-scaling-stroke" opacity=".9"/></svg>
 ${allDone ? '<div class="big-trophy">🏆</div>' : ''}
 ${nodes.map((p, i) => {
                const n = i + 1, L = LEVELS[i], locked = n > state.unlocked, stars = state.levelStars[n] || 0;
                return `<button class="node ${locked ? 'locked' : ''} ${(!locked && !state.completed[n]) ? 'next' : ''}" style="left:${p.x}%;top:${p.y}%" data-n="${n}" ${locked ? '' : 'aria-label="Level ' + n + ' ' + L.name + '"'}>
<span class="nnum">${n}</span><span class="nicon">${locked ? '🔒' : L.icon}</span><span class="nstars">${'⭐'.repeat(stars)}${'·'.repeat(3 - stars)}</span></button>
<div class="node-label" style="left:${p.x}%;top:${p.y}%">${locked ? '? ' + L.arena : L.arena}</div>`
            }).join('')}
</div>
<div class="map-actions"><button class="btn btn-primary btn-huge" id="btn-report">🏅 MY FINAL REPORT</button></div></div>`;
            APP.querySelectorAll('.node').forEach(nd => {
                nd.onclick = () => {
                    const n = +nd.dataset.n;
                    if (n > state.unlocked) { sfx.wrong(); toast(`🔒 Complete Level ${state.unlocked}: ${LEVELS[state.unlocked - 1].name} to unlock!`) }
                    else { sfx.click(); levelIntro(n) }
                }
            });
            document.querySelector('.btn-mute').onclick = toggleMute;
            $('#btn-report').onclick = () => { sfx.click(); renderReport() };
            $('#btn-reset').onclick = () => { if (confirm('Start a completely new game? All stars and points will be reset.')) { state = defaultState(); save(); renderWelcome() } }
        }

        /* ================= WELCOME ================= */
        function renderWelcome() {
            const ATHLETES = '🏃‍♀️ ⚽ 🏊‍♂️ 🏀 🤸‍♀️ 🚴‍♂️ 🏋️ ⚡ 🥇 🎾 🏆 👟 🤾‍♂️ 🏟️ 🥉 ';
            APP.innerHTML = `<div class="welcome">
<div class="rings"><div class="rrow"><i class="r b"></i><i class="r k"></i><i class="r r"></i></div><div class="rrow2"><i class="r y"></i><i class="r g"></i></div></div>
<h1 class="game-title">PAST SIMPLE<br>CHAMPIONS!</h1>
<p class="tagline">⚡ The Ultimate Sports Adventure — learn the Past Simple and win gold! 🏅</p>
<div class="marquee"><div class="marquee-inner">${ATHLETES.repeat(4)}</div></div>
<div class="namebox"><label for="champname">👤 Player or team name:</label>
<input id="champname" maxlength="24" placeholder="e.g. Team Lightning ⚡" value="${state.name || ''}"></div>
<button class="btn btn-primary btn-huge" id="btn-start">🚀 START THE GAMES</button>
<div class="howto"><span>✅ 10 points per answer</span><span>⚡ speed bonus</span><span>⭐ 3 stars per level</span><span>🔓 7 arenas to unlock</span><span>🔊 listen & speak</span></div>
<p class="welcome-tip">🧑‍🏫 Tip: play alone, in pairs, or in class teams — take turns and compare scores on the final report!</p>
</div>`;
            $('#btn-start').onclick = () => { state.name = $('#champname').value.trim() || 'Champion'; save(); sfx.fanfare(); renderMap() }
        }

        /* ================= BOOT ================= */
        (function decor() {
            const d = document.getElementById('bgdecor');
            ['⚽', '🏀', '🏊', '🏆', '🎾', '🚴', '🏅', '🤸', '🏃', '🏐'].forEach((e, i) => {
                const s = document.createElement('span');
                s.textContent = e; s.style.left = (4 + ((i * 97) % 92)) + '%'; s.style.top = (5 + ((i * 53) % 86)) + '%';
                s.style.animationDelay = (i * .7) + 's'; s.style.fontSize = (54 + ((i * 37) % 60)) + 'px'; d.appendChild(s)
            })
        })();
        window.addEventListener('resize', () => { const c = document.getElementById('confetti'); c.width = innerWidth; c.height = innerHeight });
        renderWelcome();
    </script>
</body>

</html>
